<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>media-repo uploader</title>
<style>
  :root {
    --bg: #0c0e0c;
    --fg: #d7f5d7;
    --accent: #5fff8f;
    --muted: #5b6b5b;
    --border: #1e261e;
    --panel: #10140f;
    --error: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
  }
  #shell {
    max-width: 480px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }
  header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 24px;
    color: var(--muted);
    font-size: 13px;
  }
  header .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent);
  }
  h1 {
    font-size: 15px;
    color: var(--fg);
    margin: 0 0 24px;
    font-weight: 600;
  }
  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .field { margin-bottom: 18px; }
  input[type="text"], input[type="password"] {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--fg);
    padding: 10px 12px;
    font-family: inherit;
    font-size: 14px;
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  #dropzone {
    border: 1px dashed var(--border);
    background: var(--panel);
    padding: 24px 12px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
  }
  #dropzone.drag { border-color: var(--accent); color: var(--accent); }
  #fileInput { display: none; }
  #fileList { margin-top: 10px; font-size: 12px; color: var(--muted); }
  #fileList div { padding: 2px 0; }
  button#submitBtn {
    width: 100%;
    background: var(--accent);
    color: #06120a;
    border: none;
    padding: 12px;
    font-family: inherit;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    margin-top: 6px;
  }
  button#submitBtn:disabled { opacity: 0.5; cursor: default; }
  .secondary-btn {
    display: block;
    width: 100%;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 9px;
    font-family: inherit;
    font-size: 12.5px;
    cursor: pointer;
    margin-top: 8px;
  }
  .secondary-btn:hover { color: var(--accent); border-color: var(--accent); }
  #log {
    margin-top: 20px;
    font-size: 12.5px;
    white-space: pre-wrap;
    word-break: break-all;
    border-top: 1px solid var(--border);
    padding-top: 14px;
    color: var(--muted);
  }
  #log .ok { color: var(--accent); }
  #log .err { color: var(--error); }
  #log a { color: var(--accent); }
</style>
</head>
<body>
<div id="shell">
  <header><span class="dot"></span>media-repo uploader</header>
  <h1>Upload foto/video &rarr; GitHub</h1>

  <div class="field">
    <label>Token</label>
    <input type="password" id="token" placeholder="token akses" />
  </div>

  <div class="field">
    <label>Nama folder</label>
    <input type="text" id="folder" placeholder="misal: batch-1" />
  </div>

  <div class="field">
    <label>File (foto / video)</label>
    <div id="dropzone">Ketuk untuk pilih file, atau tarik ke sini</div>
    <button type="button" id="folderBtn" class="secondary-btn">Atau pilih folder (upload semua isinya)</button>
    <input type="file" id="fileInput" multiple accept="image/*,video/*" />
    <input type="file" id="folderInput" webkitdirectory directory multiple />
    <div id="fileList"></div>
  </div>

  <button id="submitBtn">Upload &amp; Push</button>

  <div id="log"></div>
</div>

<script>
(function () {
  var tokenInput = document.getElementById('token');
  var folderInput = document.getElementById('folder');
  var dropzone = document.getElementById('dropzone');
  var fileInput = document.getElementById('fileInput');
  var folderInput = document.getElementById('folderInput');
  var folderBtn = document.getElementById('folderBtn');
  var fileList = document.getElementById('fileList');
  var submitBtn = document.getElementById('submitBtn');
  var log = document.getElementById('log');

  var savedToken = localStorage.getItem('wt_token');
  if (savedToken) tokenInput.value = savedToken;

  var selectedFiles = [];

  dropzone.addEventListener('click', function () { fileInput.click(); });
  dropzone.addEventListener('dragover', function (e) { e.preventDefault(); dropzone.classList.add('drag'); });
  dropzone.addEventListener('dragleave', function () { dropzone.classList.remove('drag'); });
  dropzone.addEventListener('drop', function (e) {
    e.preventDefault();
    dropzone.classList.remove('drag');
    handleFiles(e.dataTransfer.files);
  });
  fileInput.addEventListener('change', function () { handleFiles(fileInput.files); });

  folderBtn.addEventListener('click', function () { folderInput.click(); });
  folderInput.addEventListener('change', function () {
    // Ambil SEMUA file di dalam folder (termasuk subfolder), tapi buang
    // struktur foldernya - hanya nama file yang dipakai, tidak upload
    // foldernya sendiri.
    var mediaOnly = Array.from(folderInput.files).filter(function (f) {
      return /\.(jpe?g|png|webp|mp4)$/i.test(f.name);
    });
    handleFiles(mediaOnly);
  });

  function handleFiles(fl) {
    selectedFiles = Array.from(fl);
    fileList.innerHTML = selectedFiles.map(function (f) {
      return '<div>' + f.name + ' (' + Math.round(f.size / 1024) + ' KB)</div>';
    }).join('');
  }

  function fileToBase64(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () {
        var result = reader.result;
        var base64 = result.split(',')[1];
        resolve(base64);
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function writeLog(html, cls) {
    var div = document.createElement('div');
    if (cls) div.className = cls;
    div.innerHTML = html;
    log.appendChild(div);
  }

  submitBtn.addEventListener('click', async function () {
    log.innerHTML = '';
    var token = tokenInput.value.trim();
    var folder = folderInput.value.trim();

    if (!token) { writeLog('Token wajib diisi.', 'err'); return; }
    if (!folder) { writeLog('Nama folder wajib diisi.', 'err'); return; }
    if (selectedFiles.length === 0) { writeLog('Pilih minimal 1 file.', 'err'); return; }

    localStorage.setItem('wt_token', token);

    submitBtn.disabled = true;
    writeLog('Membaca ' + selectedFiles.length + ' file...');

    try {
      var files = [];
      for (var i = 0; i < selectedFiles.length; i++) {
        var b64 = await fileToBase64(selectedFiles[i]);
        files.push({ name: selectedFiles[i].name, dataBase64: b64 });
      }

      writeLog('Mengunggah & push ke GitHub, tunggu sebentar...');

      var res = await fetch('/api/upload', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-terminal-token': token,
        },
        body: JSON.stringify({ folder: folder, files: files }),
      });
      var data = await res.json();

      if (!res.ok || data.error) {
        writeLog('Gagal: ' + (data.error || res.statusText), 'err');
      } else {
        writeLog('Berhasil push ' + data.added.length + ' file. Total item di folder: ' + data.total, 'ok');
        writeLog('api.json: <a href="' + data.apiUrl + '" target="_blank">' + data.apiUrl + '</a>');
      }
    } catch (err) {
      writeLog('Error: ' + err.message, 'err');
    } finally {
      submitBtn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
