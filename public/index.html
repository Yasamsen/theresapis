<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>web-terminal</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/xterm/5.3.0/css/xterm.min.css" />
<style>
  :root {
    --bg: #0c0e0c;
    --fg: #d7f5d7;
    --accent: #5fff8f;
    --muted: #5b6b5b;
    --border: #1e261e;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
  }
  #topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    color: var(--muted);
  }
  #topbar .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 8px;
    box-shadow: 0 0 6px var(--accent);
  }
  #status { color: var(--muted); }
  #wrap {
    height: calc(100% - 42px);
    padding: 10px;
  }
  #term { height: 100%; }

  #authScreen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
  }
  #authScreen input {
    background: #10140f;
    border: 1px solid var(--border);
    color: var(--fg);
    padding: 10px 12px;
    font-family: inherit;
    font-size: 14px;
    width: 260px;
    outline: none;
  }
  #authScreen input:focus { border-color: var(--accent); }
  #authScreen button {
    background: var(--accent);
    color: #06120a;
    border: none;
    padding: 10px 16px;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  #authScreen p { color: var(--muted); font-size: 12px; max-width: 280px; text-align: center; }
  #authError { color: #ff6b6b; font-size: 12px; min-height: 14px; }
</style>
</head>
<body>

<div id="authScreen">
  <div style="color:var(--accent); font-size:14px; letter-spacing:0.5px;">web-terminal</div>
  <input id="tokenInput" type="password" placeholder="masukkan token" autofocus />
  <button id="tokenSubmit">Masuk</button>
  <div id="authError"></div>
  <p>Token disimpan hanya di browser ini (localStorage), dikirim tiap request lewat header.</p>
</div>

<div id="topbar" style="display:none;">
  <div><span class="dot"></span>web-terminal</div>
  <div id="status">~</div>
</div>
<div id="wrap" style="display:none;">
  <div id="term"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xterm/5.3.0/xterm.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xterm/5.3.0/addon-fit/addon-fit.min.js"></script>
<script>
(function () {
  var authScreen = document.getElementById('authScreen');
  var tokenInput = document.getElementById('tokenInput');
  var tokenSubmit = document.getElementById('tokenSubmit');
  var authError = document.getElementById('authError');
  var topbar = document.getElementById('topbar');
  var wrap = document.getElementById('wrap');
  var statusEl = document.getElementById('status');

  var savedToken = localStorage.getItem('wt_token');

  function boot(token) {
    authScreen.style.display = 'none';
    topbar.style.display = 'flex';
    wrap.style.display = 'block';
    startTerminal(token);
  }

  if (savedToken) {
    boot(savedToken);
  }

  tokenSubmit.addEventListener('click', submit);
  tokenInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') submit();
  });

  function submit() {
    var t = tokenInput.value.trim();
    if (!t) return;
    localStorage.setItem('wt_token', t);
    boot(t);
  }

  function startTerminal(token) {
    var term = new Terminal({
      cursorBlink: true,
      fontFamily: "'JetBrains Mono', Menlo, Consolas, monospace",
      fontSize: 14,
      theme: {
        background: '#0c0e0c',
        foreground: '#d7f5d7',
        cursor: '#5fff8f',
      },
    });
    var fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('term'));
    fitAddon.fit();
    window.addEventListener('resize', function () { fitAddon.fit(); });

    var cwdLabel = '~';
    var line = '';
    var history = [];
    var historyIdx = -1;

    function prompt() {
      term.write('\r\n\x1b[38;2;95;255;143m' + cwdLabel + '\x1b[0m $ ');
    }

    term.writeln('web-terminal siap. Ketik perintah node/npm/git seperti biasa.');
    term.writeln('Catatan: workspace ada di /tmp, bisa hilang jika instance server di-reset.');
    prompt();

    term.onData(function (data) {
      var code = data.charCodeAt(0);

      if (data === '\r') { // Enter
        var cmd = line;
        line = '';
        if (cmd.trim().length > 0) {
          history.push(cmd);
          historyIdx = history.length;
          runCommand(cmd);
        } else {
          prompt();
        }
        return;
      }

      if (code === 127) { // Backspace
        if (line.length > 0) {
          line = line.slice(0, -1);
          term.write('\b \b');
        }
        return;
      }

      if (data === '\u001b[A') { // Up
        if (historyIdx > 0) {
          historyIdx--;
          replaceLine(history[historyIdx]);
        }
        return;
      }
      if (data === '\u001b[B') { // Down
        if (historyIdx < history.length - 1) {
          historyIdx++;
          replaceLine(history[historyIdx]);
        } else {
          historyIdx = history.length;
          replaceLine('');
        }
        return;
      }

      if (code < 32) return; // abaikan control char lain

      line += data;
      term.write(data);
    });

    function replaceLine(newLine) {
      while (line.length > 0) {
        term.write('\b \b');
        line = line.slice(0, -1);
      }
      line = newLine;
      term.write(newLine);
    }

    function runCommand(cmd) {
      if (cmd.trim() === 'clear') {
        term.clear();
        prompt();
        return;
      }
      fetch('/api/exec', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-terminal-token': token,
        },
        body: JSON.stringify({ command: cmd }),
      })
        .then(function (r) {
          if (r.status === 401) {
            localStorage.removeItem('wt_token');
            term.writeln('\r\n\x1b[38;2;255;107;107mToken salah / kadaluarsa. Reload halaman.\x1b[0m');
            prompt();
            return null;
          }
          return r.json();
        })
        .then(function (data) {
          if (!data) return;
          if (data.error) {
            term.writeln('\r\n\x1b[38;2;255;107;107m' + data.error + '\x1b[0m');
          } else {
            if (data.stdout) term.write('\r\n' + data.stdout.replace(/\n/g, '\r\n'));
            if (data.stderr) term.write('\r\n\x1b[38;2;255;170;100m' + data.stderr.replace(/\n/g, '\r\n') + '\x1b[0m');
            if (data.cwd) {
              cwdLabel = data.cwd;
              statusEl.textContent = data.cwd;
            }
          }
          prompt();
        })
        .catch(function (err) {
          term.writeln('\r\n\x1b[38;2;255;107;107mGagal konek ke server: ' + err.message + '\x1b[0m');
          prompt();
        });
    }
  }
})();
</script>
</body>
</html>
