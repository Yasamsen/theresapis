<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>media-repo uploader</title>
<style>
  :root {
    --bg: #0c0e0c;
    --fg: #d7f5d7;
    --accent: #5fff8f;
    --muted: #5b6b5b;
    --border: #1e261e;
    --panel: #10140f;
    --error: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
  }
  #shell {
    max-width: 480px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }
  header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 24px;
    color: var(--muted);
    font-size: 13px;
  }
  header .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent);
  }
  h1 {
    font-size: 15px;
    color: var(--fg);
    margin: 0 0 24px;
    font-weight: 600;
  }
  details {
    margin-bottom: 18px;
    border: 1px solid var(--border);
    background: var(--panel);
  }
  summary {
    padding: 10px 12px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
  }
  details[open] summary { color: var(--accent); }
  .details-body { padding: 0 12px 12px; }
  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .field { margin-bottom: 14px; }
  input[type="text"], input[type="password"] {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--fg);
    padding: 10px 12px;
    font-family: inherit;
    font-size: 14px;
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  #dropzone {
    border: 1px dashed var(--border);
    background: var(--panel);
    padding: 24px 12px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
  }
  #dropzone.drag { border-color: var(--accent); color: var(--accent); }
  #fileInput, #folderInput { display: none; }
  #fileList { margin-top: 10px; font-size: 12px; color: var(--muted); max-height: 160px; overflow-y: auto; }
  #fileList div { padding: 2px 0; }
  .secondary-btn {
    display: block;
    width: 100%;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 9px;
    font-family: inherit;
    font-size: 12.5px;
    cursor: pointer;
    margin-top: 8px;
  }
  .secondary-btn:hover { color: var(--accent); border-color: var(--accent); }
  button#submitBtn {
    width: 100%;
    background: var(--accent);
    color: #06120a;
    border: none;
    padding: 12px;
    font-family: inherit;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    margin-top: 6px;
  }
  button#submitBtn:disabled { opacity: 0.5; cursor: default; }
  #log {
    margin-top: 20px;
    font-size: 12.5px;
    white-space: pre-wrap;
    word-break: break-all;
    border-top: 1px solid var(--border);
    padding-top: 14px;
    color: var(--muted);
  }
  #log .ok { color: var(--accent); }
  #log .err { color: var(--error); }
  #log a { color: var(--accent); }
</style>
</head>
<body>
<div id="shell">
  <header><span class="dot"></span>media-repo uploader</header>
  <h1>Upload foto/video &rarr; GitHub</h1>

  <details id="configBox">
    <summary>Pengaturan (token &amp; repo tujuan)</summary>
    <div class="details-body">
      <div class="field">
        <label>GitHub Personal Access Token</label>
        <input type="password" id="token" placeholder="ghp_..." />
      </div>
      <div class="field">
        <label>Owner</label>
        <input type="text" id="owner" placeholder="Yasamsen" />
      </div>
      <div class="field">
        <label>Repo</label>
        <input type="text" id="repo" placeholder="media-repo" />
      </div>
      <div class="field">
        <label>Branch</label>
        <input type="text" id="branch" placeholder="main" />
      </div>
    </div>
  </details>

  <div class="field">
    <label>Nama folder</label>
    <input type="text" id="folder" placeholder="misal: batch-1" />
  </div>

  <div class="field">
    <label>File (foto / video)</label>
    <div id="dropzone">Ketuk untuk pilih file, atau tarik ke sini</div>
    <button type="button" id="folderBtn" class="secondary-btn">Atau pilih folder (upload semua isinya)</button>
    <input type="file" id="fileInput" multiple accept="image/*,video/*" />
    <input type="file" id="folderInput" webkitdirectory directory multiple />
    <div id="fileList"></div>
    <button type="button" id="clearBtn" class="secondary-btn" style="display:none;">Kosongkan pilihan</button>
  </div>

  <button id="submitBtn">Upload &amp; Push</button>

  <div id="log"></div>
</div>

<script>
(function () {
  var tokenInput = document.getElementById('token');
  var ownerInput = document.getElementById('owner');
  var repoInput = document.getElementById('repo');
  var branchInput = document.getElementById('branch');
  var configBox = document.getElementById('configBox');
  var folderInputName = document.getElementById('folder');
  var dropzone = document.getElementById('dropzone');
  var fileInput = document.getElementById('fileInput');
  var folderInput = document.getElementById('folderInput');
  var folderBtn = document.getElementById('folderBtn');
  var fileList = document.getElementById('fileList');
  var clearBtn = document.getElementById('clearBtn');
  var submitBtn = document.getElementById('submitBtn');
  var log = document.getElementById('log');

  var LS = {
    token: 'mru_token',
    owner: 'mru_owner',
    repo: 'mru_repo',
    branch: 'mru_branch',
  };

  tokenInput.value = localStorage.getItem(LS.token) || '';
  ownerInput.value = localStorage.getItem(LS.owner) || 'Yasamsen';
  repoInput.value = localStorage.getItem(LS.repo) || 'media-repo';
  branchInput.value = localStorage.getItem(LS.branch) || 'main';

  // Buka panel pengaturan otomatis kalau token belum diisi
  if (!tokenInput.value) configBox.open = true;

  var selectedFiles = [];

  dropzone.addEventListener('click', function () { fileInput.click(); });
  dropzone.addEventListener('dragover', function (e) { e.preventDefault(); dropzone.classList.add('drag'); });
  dropzone.addEventListener('dragleave', function () { dropzone.classList.remove('drag'); });
  dropzone.addEventListener('drop', function (e) {
    e.preventDefault();
    dropzone.classList.remove('drag');
    handleFiles(e.dataTransfer.files);
  });
  fileInput.addEventListener('change', function () { handleFiles(fileInput.files); });

  folderBtn.addEventListener('click', function () { folderInput.click(); });
  folderInput.addEventListener('change', function () {
    var mediaOnly = Array.from(folderInput.files).filter(function (f) {
      return /\.(jpe?g|png|webp|mp4)$/i.test(f.name);
    });
    handleFiles(mediaOnly);
  });

  function handleFiles(fl) {
    try {
      var incoming = Array.from(fl || []);
      if (incoming.length === 0) {
        if (selectedFiles.length === 0) {
          fileList.innerHTML = '<span style="color:var(--error)">Tidak ada file terdeteksi dari pilihan tadi. Coba pilih ulang, pastikan menekan tombol konfirmasi/pilih di pemilih file HP kamu.</span>';
        }
        return;
      }
      incoming.forEach(function (nf) {
        var dup = selectedFiles.some(function (sf) {
          return sf.name === nf.name && sf.size === nf.size;
        });
        if (!dup) selectedFiles.push(nf);
      });
      renderFileList();
    } catch (err) {
      fileList.innerHTML = '<span style="color:var(--error)">Gagal membaca file: ' + err.message + '</span>';
    }
    // reset value biar bisa pilih file yang sama lagi di lain waktu
    fileInput.value = '';
    folderInput.value = '';
  }

  function renderFileList() {
    if (selectedFiles.length === 0) {
      fileList.innerHTML = '';
      clearBtn.style.display = 'none';
      return;
    }
    clearBtn.style.display = 'block';
    fileList.innerHTML = selectedFiles.length + ' file dipilih:<br>' + selectedFiles.map(function (f, i) {
      return '<div>' + f.name + ' (' + Math.round(f.size / 1024) + ' KB) '
        + '<span class="rm" data-i="' + i + '" style="color:var(--error);cursor:pointer;">[hapus]</span></div>';
    }).join('');
  }

  fileList.addEventListener('click', function (e) {
    if (e.target.classList.contains('rm')) {
      var idx = parseInt(e.target.getAttribute('data-i'), 10);
      selectedFiles.splice(idx, 1);
      renderFileList();
    }
  });

  clearBtn.addEventListener('click', function () {
    selectedFiles = [];
    renderFileList();
  });

  function fileToBase64(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () { resolve(reader.result.split(',')[1]); };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function writeLog(html, cls) {
    var div = document.createElement('div');
    if (cls) div.className = cls;
    div.innerHTML = html;
    log.appendChild(div);
  }

  function ghHeaders(token) {
    return {
      Authorization: 'Bearer ' + token,
      Accept: 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
    };
  }

  async function listFolder(apiBase, branch, folder, token) {
    var url = apiBase + '/contents/' + encodeURIComponent(folder) + '?ref=' + branch;
    var r = await fetch(url, { headers: ghHeaders(token) });
    if (r.status === 404) return [];
    if (!r.ok) throw new Error('Gagal baca folder (' + r.status + '): ' + (await r.text()));
    var data = await r.json();
    return Array.isArray(data) ? data : [];
  }

  function nextCounter(existingFiles) {
    var names = existingFiles.map(function (f) { return f.name; }).filter(function (n) { return /^[0-9]{3}\./.test(n); });
    if (names.length === 0) return 1;
    names.sort();
    return parseInt(names[names.length - 1].slice(0, 3), 10) + 1;
  }

  async function putFile(apiBase, branch, folder, filename, base64Content, message, token, existingSha) {
    var url = apiBase + '/contents/' + encodeURIComponent(folder) + '/' + encodeURIComponent(filename);
    var body = { message: message, content: base64Content, branch: branch };
    if (existingSha) body.sha = existingSha;
    var r = await fetch(url, {
      method: 'PUT',
      headers: Object.assign({ 'Content-Type': 'application/json' }, ghHeaders(token)),
      body: JSON.stringify(body),
    });
    if (!r.ok) throw new Error('Gagal upload ' + filename + ' (' + r.status + '): ' + (await r.text()));
    return r.json();
  }

  submitBtn.addEventListener('click', async function () {
    log.innerHTML = '';
    var token = tokenInput.value.trim();
    var owner = ownerInput.value.trim();
    var repo = repoInput.value.trim();
    var branch = branchInput.value.trim() || 'main';
    var folder = folderInputName.value.trim();

    if (!token) { writeLog('Token wajib diisi.', 'err'); configBox.open = true; return; }
    if (!owner || !repo) { writeLog('Owner & repo wajib diisi.', 'err'); configBox.open = true; return; }
    if (!folder || !/^[a-zA-Z0-9_-]+$/.test(folder)) { writeLog('Nama folder wajib diisi (huruf/angka/-/_ saja).', 'err'); return; }
    if (selectedFiles.length === 0) { writeLog('Pilih minimal 1 file / folder.', 'err'); return; }

    localStorage.setItem(LS.token, token);
    localStorage.setItem(LS.owner, owner);
    localStorage.setItem(LS.repo, repo);
    localStorage.setItem(LS.branch, branch);

    var apiBase = 'https://api.github.com/repos/' + owner + '/' + repo;

    submitBtn.disabled = true;
    try {
      writeLog('Mengecek isi folder di repo...');
      var existing = await listFolder(apiBase, branch, folder, token);
      var counter = nextCounter(existing);
      var added = [];

      writeLog('Mengunggah ' + selectedFiles.length + ' file...');
      for (var i = 0; i < selectedFiles.length; i++) {
        var f = selectedFiles[i];
        var ext = (f.name.split('.').pop() || 'bin').toLowerCase();
        var newName = String(counter).padStart(3, '0') + '.' + ext;
        var b64 = await fileToBase64(f);
        await putFile(apiBase, branch, folder, newName, b64, 'upload ' + folder + '/' + newName, token);
        added.push(newName);
        counter++;
        writeLog('&#10003; ' + newName);
      }

      writeLog('Menyusun ulang api.json...');
      var existingMediaNames = existing
        .map(function (f) { return f.name; })
        .filter(function (n) { return /\.(jpg|jpeg|png|webp|mp4)$/i.test(n); });
      var mediaFiles = existingMediaNames.concat(added).sort();
      var rawBase = 'https://raw.githubusercontent.com/' + owner + '/' + repo + '/' + branch + '/' + folder;
      var apiJson = {
        status: true,
        creator: 'yasamDev',
        total: mediaFiles.length,
        data: mediaFiles.map(function (n) { return rawBase + '/' + n; }),
      };
      var existingApiJson = existing.find(function (f) { return f.name === 'api.json'; });
      var apiJsonB64 = btoa(unescape(encodeURIComponent(JSON.stringify(apiJson, null, 2))));
      await putFile(apiBase, branch, folder, 'api.json', apiJsonB64, 'update api.json ' + folder, token, existingApiJson ? existingApiJson.sha : undefined);

      writeLog('Berhasil push ' + added.length + ' file. Total item di folder: ' + apiJson.total, 'ok');
      writeLog('api.json: <a href="' + rawBase + '/api.json" target="_blank">' + rawBase + '/api.json</a>');
      selectedFiles = [];
      renderFileList();
    } catch (err) {
      writeLog('Error: ' + err.message, 'err');
    } finally {
      submitBtn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
