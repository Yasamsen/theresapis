<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>media-repo uploader</title>
<style>
  :root {
    --bg: #070a08;
    --bg-elevated: #0d1310;
    --fg: #e7f5ec;
    --muted: #64766a;
    --muted-dim: #3c4a41;
    --border: #1a231d;
    --border-soft: #131a15;
    --accent: #4ff0a0;
    --accent-dim: rgba(79, 240, 160, 0.12);
    --accent-glow: rgba(79, 240, 160, 0.35);
    --warn: #ffb454;
    --error: #ff6b6b;
    --radius: 3px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
    -webkit-font-smoothing: antialiased;
  }
  body {
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(79, 240, 160, 0.07), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 110%, rgba(79, 240, 160, 0.05), transparent 60%);
    background-attachment: fixed;
  }

  .page {
    max-width: 620px;
    margin: 0 auto;
    padding: 28px 18px 70px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
    animation: dropIn 0.5s cubic-bezier(.2,.9,.3,1) both;
  }
  .brand { display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--muted); letter-spacing: 0.2px; }
  .live-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 0 var(--accent-glow);
    animation: pulseDot 2.4s ease-out infinite;
  }
  .repo-badge {
    font-size: 11px;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 4px 9px;
    border-radius: 999px;
    background: var(--bg-elevated);
  }

  .card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 26px 22px;
    animation: dropIn 0.6s 0.08s cubic-bezier(.2,.9,.3,1) both;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent-glow), transparent);
    opacity: 0.5;
  }

  h1 { font-size: 18px; margin: 0 0 4px; font-weight: 600; letter-spacing: -0.2px; }
  .subtitle { font-size: 12.5px; color: var(--muted); margin: 0 0 24px; line-height: 1.5; }

  details.settings {
    margin-bottom: 20px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg);
    transition: border-color 0.2s;
  }
  details.settings[open] { border-color: var(--muted-dim); }
  details.settings summary {
    padding: 11px 13px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
    list-style: none;
    display: flex;
    align-items: center;
    gap: 8px;
    user-select: none;
  }
  details.settings summary::-webkit-details-marker { display: none; }
  details.settings summary::before { content: '▸'; display: inline-block; transition: transform 0.2s; color: var(--muted-dim); }
  details.settings[open] summary::before { transform: rotate(90deg); color: var(--accent); }
  details.settings[open] summary { color: var(--fg); }
  .settings-body { padding: 2px 13px 15px; }

  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 6px; letter-spacing: 0.15px; }
  input[type="text"], input[type="password"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--fg);
    padding: 10px 12px;
    font-family: inherit;
    font-size: 13.5px;
    border-radius: var(--radius);
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
  input::placeholder { color: var(--muted-dim); }

  .folder-field { margin: 20px 0; }

  #dropzone {
    border: 1px dashed var(--border);
    background: var(--bg);
    padding: 26px 12px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    border-radius: var(--radius);
    transition: border-color 0.2s, background 0.2s, transform 0.15s;
  }
  #dropzone:hover { border-color: var(--muted-dim); color: var(--fg); }
  #dropzone:active { transform: scale(0.99); }
  #dropzone.drag { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
  #dropzone .dz-icon { display: block; font-size: 18px; margin-bottom: 6px; opacity: 0.6; }

  #fileInput, #folderInput { display: none; }

  .secondary-btn {
    display: block;
    width: 100%;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 10px;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    margin-top: 8px;
    border-radius: var(--radius);
    transition: color 0.15s, border-color 0.15s;
  }
  .secondary-btn:hover { color: var(--accent); border-color: var(--accent); }

  #fileList { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
  #fileList:empty { margin-top: 0; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-left: 2px solid var(--muted-dim);
    padding: 5px 6px 5px 9px;
    font-size: 11.5px;
    color: var(--fg);
    border-radius: var(--radius);
    max-width: 100%;
    animation: chipIn 0.25s ease both;
  }
  .chip.video { border-left-color: #7fb8ff; }
  .chip .chip-name { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip .chip-size { color: var(--muted); }
  .chip .chip-rm { color: var(--muted); cursor: pointer; font-size: 13px; line-height: 1; padding: 0 2px; transition: color 0.15s; }
  .chip .chip-rm:hover { color: var(--error); }

  .file-notice { font-size: 12px; color: var(--error); margin-top: 10px; }
  .file-summary { font-size: 11.5px; color: var(--muted); margin-bottom: 8px; width: 100%; }

  #submitBtn {
    width: 100%;
    background: var(--accent);
    color: #05140b;
    border: none;
    padding: 13px;
    font-family: inherit;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    margin-top: 22px;
    border-radius: var(--radius);
    letter-spacing: 0.2px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    transition: transform 0.12s, box-shadow 0.2s, opacity 0.2s;
  }
  #submitBtn:hover:not(:disabled) { box-shadow: 0 4px 24px -6px var(--accent-glow); transform: translateY(-1px); }
  #submitBtn:active:not(:disabled) { transform: translateY(0); }
  #submitBtn:disabled { opacity: 0.55; cursor: default; }
  .btn-spinner {
    width: 13px; height: 13px;
    border: 2px solid rgba(5,20,11,0.35);
    border-top-color: #05140b;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  #progressWrap { margin-top: 20px; animation: fadeUp 0.3s ease both; }
  .progress-step { font-size: 12.5px; color: var(--fg); margin-bottom: 8px; min-height: 16px; }
  .progress-track { height: 4px; background: var(--border); border-radius: 999px; overflow: hidden; }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), #7fffc4);
    border-radius: 999px;
    transition: width 0.4s cubic-bezier(.3,.7,.3,1);
    box-shadow: 0 0 10px var(--accent-glow);
  }

  details.log-details { margin-top: 16px; }
  details.log-details summary { font-size: 11.5px; color: var(--muted-dim); cursor: pointer; list-style: none; }
  details.log-details summary::-webkit-details-marker { display: none; }
  details.log-details summary::before { content: '▸ '; }
  details.log-details[open] summary::before { content: '▾ '; }
  #log {
    margin-top: 10px;
    font-size: 12px;
    white-space: pre-wrap;
    word-break: break-all;
    color: var(--muted);
    max-height: 220px;
    overflow-y: auto;
    padding-right: 4px;
  }
  #log div { padding: 2px 0; animation: fadeUp 0.2s ease both; }
  #log .ok { color: var(--accent); }
  #log .err { color: var(--error); }
  #log a { color: var(--accent); }

  .foot-note { text-align: center; font-size: 11px; color: var(--muted-dim); margin-top: 18px; padding: 0 10px; }

  @keyframes pulseDot {
    0% { box-shadow: 0 0 0 0 var(--accent-glow); }
    70% { box-shadow: 0 0 0 7px rgba(79, 240, 160, 0); }
    100% { box-shadow: 0 0 0 0 rgba(79, 240, 160, 0); }
  }
  @keyframes dropIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes chipIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  @media (min-width: 640px) {
    .page { padding-top: 56px; }
    .card { padding: 34px 40px; }
    h1 { font-size: 20px; }
  }
  @media (max-width: 380px) {
    .card { padding: 20px 16px; }
    .chip .chip-name { max-width: 100px; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <div class="brand"><span class="live-dot"></span>media-repo uploader</div>
    <div class="repo-badge" id="repoBadge">Yasamsen/media-repo</div>
  </div>

  <main class="card">
    <h1>Upload ke GitHub</h1>
    <p class="subtitle">Pilih foto atau video, sistem menomori otomatis dan push langsung ke repo.</p>

    <details class="settings" id="configBox">
      <summary>Pengaturan token &amp; repo tujuan</summary>
      <div class="settings-body">
        <div class="field">
          <label>GitHub Personal Access Token</label>
          <input type="password" id="token" placeholder="ghp_..." />
        </div>
        <div class="field">
          <label>Owner</label>
          <input type="text" id="owner" placeholder="Yasamsen" />
        </div>
        <div class="field">
          <label>Repo</label>
          <input type="text" id="repo" placeholder="media-repo" />
        </div>
        <div class="field">
          <label>Branch</label>
          <input type="text" id="branch" placeholder="main" />
        </div>
      </div>
    </details>

    <div class="field folder-field">
      <label>Nama folder</label>
      <input type="text" id="folder" placeholder="misal: batch-1" />
    </div>

    <div class="field">
      <label>File (foto / video)</label>
      <div id="dropzone">
        <span class="dz-icon">&#9662;</span>
        Ketuk untuk pilih file, atau tarik ke sini
      </div>
      <button type="button" id="folderBtn" class="secondary-btn">Atau pilih folder (upload semua isinya)</button>
      <input type="file" id="fileInput" multiple accept="image/*,video/*" />
      <input type="file" id="folderInput" webkitdirectory directory multiple />
      <div id="fileList"></div>
    </div>

    <button id="submitBtn">
      <span class="btn-label">Upload &amp; Push</span>
    </button>

    <div id="progressWrap" hidden>
      <div class="progress-step" id="progressStepLabel"></div>
      <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
    </div>

    <details class="log-details">
      <summary>Detail proses</summary>
      <div id="log"></div>
    </details>
  </main>

  <div class="foot-note">Token disimpan hanya di browser ini, dikirim langsung ke api.github.com.</div>
</div>

<script>
(function () {
  var tokenInput = document.getElementById('token');
  var ownerInput = document.getElementById('owner');
  var repoInput = document.getElementById('repo');
  var branchInput = document.getElementById('branch');
  var configBox = document.getElementById('configBox');
  var repoBadge = document.getElementById('repoBadge');
  var folderInputName = document.getElementById('folder');
  var dropzone = document.getElementById('dropzone');
  var fileInput = document.getElementById('fileInput');
  var folderInput = document.getElementById('folderInput');
  var folderBtn = document.getElementById('folderBtn');
  var fileList = document.getElementById('fileList');
  var submitBtn = document.getElementById('submitBtn');
  var btnLabel = submitBtn.querySelector('.btn-label');
  var log = document.getElementById('log');
  var progressWrap = document.getElementById('progressWrap');
  var progressBar = document.getElementById('progressBar');
  var progressStepLabel = document.getElementById('progressStepLabel');

  var LS = { token: 'mru_token', owner: 'mru_owner', repo: 'mru_repo', branch: 'mru_branch' };

  tokenInput.value = localStorage.getItem(LS.token) || '';
  ownerInput.value = localStorage.getItem(LS.owner) || 'Yasamsen';
  repoInput.value = localStorage.getItem(LS.repo) || 'media-repo';
  branchInput.value = localStorage.getItem(LS.branch) || 'main';
  updateBadge();

  if (!tokenInput.value) configBox.open = true;

  [ownerInput, repoInput].forEach(function (el) { el.addEventListener('input', updateBadge); });
  function updateBadge() {
    repoBadge.textContent = (ownerInput.value || 'owner') + '/' + (repoInput.value || 'repo');
  }

  var selectedFiles = [];

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  dropzone.addEventListener('click', function () { fileInput.click(); });
  dropzone.addEventListener('dragover', function (e) { e.preventDefault(); dropzone.classList.add('drag'); });
  dropzone.addEventListener('dragleave', function () { dropzone.classList.remove('drag'); });
  dropzone.addEventListener('drop', function (e) {
    e.preventDefault();
    dropzone.classList.remove('drag');
    handleFiles(e.dataTransfer.files);
  });
  fileInput.addEventListener('change', function () { handleFiles(fileInput.files); });

  folderBtn.addEventListener('click', function () { folderInput.click(); });
  folderInput.addEventListener('change', function () {
    var mediaOnly = Array.from(folderInput.files).filter(function (f) {
      return /\.(jpe?g|png|webp|mp4)$/i.test(f.name);
    });
    handleFiles(mediaOnly);
  });

  function handleFiles(fl) {
    try {
      var incoming = Array.from(fl || []);
      if (incoming.length === 0) {
        if (selectedFiles.length === 0) {
          renderNotice('Tidak ada file terdeteksi dari pilihan tadi. Coba pilih ulang, pastikan menekan tombol konfirmasi/pilih di pemilih file HP kamu.');
        }
      } else {
        incoming.forEach(function (nf) {
          var dup = selectedFiles.some(function (sf) { return sf.name === nf.name && sf.size === nf.size; });
          if (!dup) selectedFiles.push(nf);
        });
        renderFileList();
      }
    } catch (err) {
      renderNotice('Gagal membaca file: ' + err.message);
    }
    fileInput.value = '';
    folderInput.value = '';
  }

  function renderNotice(msg) {
    fileList.innerHTML = '<div class="file-notice">' + msg + '</div>';
  }

  function renderFileList() {
    if (selectedFiles.length === 0) { fileList.innerHTML = ''; return; }
    var summary = '<div class="file-summary">' + selectedFiles.length + ' file dipilih &middot; <span id="clearSel" style="color:var(--error);cursor:pointer;">kosongkan</span></div>';
    var chips = selectedFiles.map(function (f, i) {
      var isVideo = /\.mp4$/i.test(f.name);
      return '<span class="chip' + (isVideo ? ' video' : '') + '">'
        + '<span class="chip-name">' + f.name + '</span>'
        + '<span class="chip-size">' + Math.round(f.size / 1024) + 'KB</span>'
        + '<span class="chip-rm" data-i="' + i + '">&times;</span>'
        + '</span>';
    }).join('');
    fileList.innerHTML = summary + chips;
    document.getElementById('clearSel').addEventListener('click', function () {
      selectedFiles = [];
      renderFileList();
    });
    fileList.querySelectorAll('.chip-rm').forEach(function (el) {
      el.addEventListener('click', function () {
        selectedFiles.splice(parseInt(el.getAttribute('data-i'), 10), 1);
        renderFileList();
      });
    });
  }

  function fileToBase64(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () { resolve(reader.result.split(',')[1]); };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function writeLog(html, cls) {
    var div = document.createElement('div');
    if (cls) div.className = cls;
    div.innerHTML = html;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  function setProgress(pct, label) {
    progressBar.style.width = Math.max(2, Math.min(100, pct)) + '%';
    if (label) progressStepLabel.textContent = label;
  }

  function ghHeaders(token) {
    return { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
  }

  async function listFolder(apiBase, branch, folder, token) {
    var url = apiBase + '/contents/' + encodeURIComponent(folder) + '?ref=' + branch;
    var r = await fetch(url, { headers: ghHeaders(token) });
    if (r.status === 404) return [];
    if (!r.ok) throw new Error('Gagal baca folder (' + r.status + '): ' + (await r.text()));
    var data = await r.json();
    return Array.isArray(data) ? data : [];
  }

  function nextCounter(existingFiles) {
    var names = existingFiles.map(function (f) { return f.name; }).filter(function (n) { return /^[0-9]{3}\./.test(n); });
    if (names.length === 0) return 1;
    names.sort();
    return parseInt(names[names.length - 1].slice(0, 3), 10) + 1;
  }

  async function putFile(apiBase, branch, folder, filename, base64Content, message, token, existingSha) {
    var url = apiBase + '/contents/' + encodeURIComponent(folder) + '/' + encodeURIComponent(filename);
    var body = { message: message, content: base64Content, branch: branch };
    if (existingSha) body.sha = existingSha;
    var r = await fetch(url, {
      method: 'PUT',
      headers: Object.assign({ 'Content-Type': 'application/json' }, ghHeaders(token)),
      body: JSON.stringify(body),
    });
    if (!r.ok) throw new Error('Gagal upload ' + filename + ' (' + r.status + '): ' + (await r.text()));
    return r.json();
  }

  function setBusy(isBusy) {
    submitBtn.disabled = isBusy;
    if (isBusy) {
      btnLabel.textContent = 'Memproses...';
      var spinner = document.createElement('span');
      spinner.className = 'btn-spinner';
      submitBtn.appendChild(spinner);
    } else {
      btnLabel.textContent = 'Upload & Push';
      var sp = submitBtn.querySelector('.btn-spinner');
      if (sp) sp.remove();
    }
  }

  submitBtn.addEventListener('click', async function () {
    log.innerHTML = '';
    var token = tokenInput.value.trim();
    var owner = ownerInput.value.trim();
    var repo = repoInput.value.trim();
    var branch = branchInput.value.trim() || 'main';
    var folder = folderInputName.value.trim();

    if (!token) { writeLog('Token wajib diisi.', 'err'); configBox.open = true; return; }
    if (!owner || !repo) { writeLog('Owner &amp; repo wajib diisi.', 'err'); configBox.open = true; return; }
    if (!folder || !/^[a-zA-Z0-9_-]+$/.test(folder)) { writeLog('Nama folder wajib diisi (huruf/angka/-/_ saja).', 'err'); return; }
    if (selectedFiles.length === 0) { writeLog('Pilih minimal 1 file / folder.', 'err'); return; }

    localStorage.setItem(LS.token, token);
    localStorage.setItem(LS.owner, owner);
    localStorage.setItem(LS.repo, repo);
    localStorage.setItem(LS.branch, branch);

    var apiBase = 'https://api.github.com/repos/' + owner + '/' + repo;
    var totalSteps = selectedFiles.length + 2;
    var stepDone = 0;

    setBusy(true);
    progressWrap.hidden = false;
    setProgress(2, 'Menghubungkan ke GitHub...');
    await sleep(350);

    try {
      setProgress(8, 'Memeriksa folder tujuan...');
      writeLog('Mengecek isi folder di repo...');
      var existing = await listFolder(apiBase, branch, folder, token);
      var counter = nextCounter(existing);
      var added = [];
      stepDone++;
      await sleep(250);

      for (var i = 0; i < selectedFiles.length; i++) {
        var f = selectedFiles[i];
        setProgress(10 + (stepDone / totalSteps) * 80, 'Mengunggah ' + f.name + '...');
        var ext = (f.name.split('.').pop() || 'bin').toLowerCase();
        var newName = String(counter).padStart(3, '0') + '.' + ext;
        var b64 = await fileToBase64(f);
        await putFile(apiBase, branch, folder, newName, b64, 'upload ' + folder + '/' + newName, token);
        added.push(newName);
        counter++;
        stepDone++;
        writeLog('&#10003; ' + newName);
        await sleep(180);
      }

      setProgress(94, 'Menyusun ulang api.json...');
      writeLog('Menyusun ulang api.json...');
      await sleep(300);

      var existingMediaNames = existing.map(function (f) { return f.name; }).filter(function (n) { return /\.(jpg|jpeg|png|webp|mp4)$/i.test(n); });
      var mediaFiles = existingMediaNames.concat(added).sort();
      var rawBase = 'https://raw.githubusercontent.com/' + owner + '/' + repo + '/' + branch + '/' + folder;
      var apiJson = { status: true, creator: 'yasamDev', total: mediaFiles.length, data: mediaFiles.map(function (n) { return rawBase + '/' + n; }) };
      var existingApiJson = existing.find(function (f) { return f.name === 'api.json'; });
      var apiJsonB64 = btoa(unescape(encodeURIComponent(JSON.stringify(apiJson, null, 2))));
      await putFile(apiBase, branch, folder, 'api.json', apiJsonB64, 'update api.json ' + folder, token, existingApiJson ? existingApiJson.sha : undefined);

      setProgress(100, 'Selesai.');
      await sleep(200);
      writeLog('Berhasil push ' + added.length + ' file. Total item di folder: ' + apiJson.total, 'ok');
      writeLog('api.json: <a href="' + rawBase + '/api.json" target="_blank">' + rawBase + '/api.json</a>');

      selectedFiles = [];
      renderFileList();
    } catch (err) {
      setProgress(100, 'Gagal.');
      writeLog('Error: ' + err.message, 'err');
    } finally {
      setBusy(false);
      await sleep(900);
      progressWrap.hidden = true;
      setProgress(0, '');
    }
  });
})();
</script>
</body>
</html>
